# Terminal projection on vs. off (Shelf). "On" is tab_shelf.yaml's CS-Pi row.
benchmark: shelf
checkpoint: shelf
units: [clutter_combo, tall_table_pillar, two_flankers_top, mid_rung_neighbor_E, low_rung_neighbor_E]
logl_cap: 400
table:
  columns: {Safe-SR: success, Goal reaching: goal, Collision: collision, logL: logl_mean, NFE: nfe}
  percent: [success, goal, collision]
methods:
  CS-Pi (no terminal proj.): {sampler: cspi, k: 50.0, k_max: 5, tau: 1.0e-3, step_size: 0.1, terminal_projection: false}

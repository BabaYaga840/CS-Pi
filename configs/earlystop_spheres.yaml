# CS-Pi stopping rules on Sphere-Avoid (same rules as earlystop_d3il.yaml; K_max = 20 as in tab_spheres.yaml).
benchmark: spheres
policy: {type: flow, checkpoint: spheres}
constraint: {type: spline_collision, proj_steps: 10, tau: 1.0e-3, cbf_groups: obs+jl}
units: [id, ood]
logl: false
table:
  per_unit: true
  columns: {SR: success, NFE: nfe}
  percent: [success]
methods:
  none:      {sampler: cspi, k: [1.0, 10.0, 20.0, 50.0, 100.0], k_max: 20, tau: 1.0e-3, step_size: 0.1}
  n>0.8:     {sampler: cspi, k: [1.0, 10.0, 20.0, 50.0, 100.0], k_max: 20, tau: 1.0e-3, step_size: 0.1, n_threshold: 0.8}
  n>0.9:     {sampler: cspi, k: [1.0, 10.0, 20.0, 50.0, 100.0], k_max: 20, tau: 1.0e-3, step_size: 0.1, n_threshold: 0.9}
  patience5: {sampler: cspi, k: [1.0, 10.0, 20.0, 50.0, 100.0], k_max: 20, tau: 1.0e-3, step_size: 0.1, patience: 5}

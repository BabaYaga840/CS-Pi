# Orient hyperparameters -- CS-Pi proximal weight beta, guidance alpha, and Trust with / without
# the joint-limit term in its cost (same protocol as tab_orient.yaml).
benchmark: orient
checkpoint: orient
units: [0, 1, 2]
logl: false
table:
  columns: {Success: success, Goal reaching: goal, Joint limits ok: joint_limits_ok, NFE: nfe}
  percent: [success, goal, joint_limits_ok]
methods:
  CS-Pi + EE-prox: {sampler: cspi, k: 10.0, k_max: 3, tau: 1.0e-3, step_size: 0.1,
                    problem: {ee_prox: true, lam_ee: 3000.0, beta: [1.0e+3, 1.0e+5, 1.0e+6], proj_steps: 5}}
  Guidance:        {sampler: guidance, alpha: [0.001, 0.003, 0.01, 0.03, 0.1], step_size: 0.1,
                    problem: {lam_jl: 100.0}}
  Trust:           {sampler: trust, w: 0.001, j_max: 8, stop_tol: 1.0e-3, step_size: 0.1,
                    problem: {lam_jl: [0.0, 100.0]}}

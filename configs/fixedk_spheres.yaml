# One k for every benchmark (k = 20), against each benchmark's tuned k (tab_spheres.yaml: k = 50).
benchmark: spheres
policy: {type: flow, checkpoint: spheres}
constraint: {type: spline_collision, proj_steps: 10, tau: 1.0e-3, cbf_groups: obs+jl}
units: [id, ood]
logl_cap: null
table:
  per_unit: true
  columns: {SR: success, logL: logl_mean, NFE: nfe}
  percent: [success]
methods:
  CS-Pi: {sampler: cspi, k: 20.0, k_max: 20, tau: 1.0e-3, step_size: 0.1}

# tab:walltime (Spheres column) -- wall-clock per task (8 samples); one process on one node.
benchmark: spheres
policy: {type: flow, checkpoint: spheres}
constraint: {type: spline_collision, proj_steps: 10, tau: 1.0e-3, cbf_groups: obs+jl}
methods_from: tab_spheres.yaml
only: [CS-Pi, Trust, Projection, Guidance, Unguided, SafeDiffuser, SafeFlowMatcher]
units: [id]
eval: {n_tasks: 20}
logl: false
table:
  columns: {s per rollout: wall_s_per_rollout, NFE: nfe}

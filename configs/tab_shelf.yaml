# tab:shelf -- Shelf pick-and-place, 5 obstacle scenarios x 30 tasks (4 samples each).
benchmark: shelf
checkpoint: shelf
units: [clutter_combo, tall_table_pillar, two_flankers_top, mid_rung_neighbor_E, low_rung_neighbor_E]
logl_cap: 400                     # chunks scored per scenario
table:
  columns: {Safe-SR: success, Goal reaching: goal, Collision: collision, logL: logl_mean, NFE: nfe}
  percent: [success, goal, collision]
methods:
  CS-Pi:           {sampler: cspi, k: 10.0, k_max: 5, tau: 1.0e-3, step_size: 0.1}
  Projection:      {sampler: projection, tau: 1.0e-3, step_size: 0.1}
  Rejection:       {sampler: rejection, budget: 100, tau: 1.0e-3, step_size: 0.1}
  Guidance:        {sampler: guidance, alpha: 0.2, step_size: 0.1, problem: {post_slide: true}}
  Trust:           {sampler: trust, w: 0.01, j_max: 5, stop_tol: 1.0e-3, step_size: 0.1, problem: {post_slide: true}}
  Unguided:        {sampler: unguided, step_size: 0.1}
  SafeFlowMatcher: {sampler: safeflowmatcher, T_p: 10, T_c: 8, alpha: 0.07, eps: 5.0, rho: 0.7, state: tweedie,
                    problem: {cbf_groups: obs+jl+self}}
  SafeDiffuser:    {sampler: safediffuser, n_steps: 10, lam: 200.0, state: tweedie, problem: {cbf_groups: obs+jl}}

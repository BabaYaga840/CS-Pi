# One k for every benchmark: tab_d3il.yaml's CS-Pi row (terminal projection on, K_max 5, 6 scenarios x
# 200 rollouts, same seeds) with k = 50.
benchmark: avoid2d
checkpoint: avoid2d
units: [left, right, both, cluttered, narrow_passage, narrower_passage]
eval: {n_seeds: 40, n_episodes: 5}
logl_cap: 400
table:
  columns: {Safe-SR: success, Fully in support: fully_in_support, logL: logl_mean, NFE: nfe}
  percent: [success]
methods:
  CS-Pi: {sampler: cspi, k: [50.0], k_max: 5, tau: 0.01, step_size: 0.5}

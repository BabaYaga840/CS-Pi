# tab:schedule-ablation -- how the rollback depth is chosen (2D, K_max = 5). The table reports how often
# the terminal fallback fires (fraction of plan steps that end still infeasible).
#   k/(k+delta)  : CS-Pi's adaptive depth
#   n = 0.5, 0.8 : fixed depth
#   zero noise   : adaptive depth, but renoise with x_n = n g (no fresh noise)
benchmark: avoid2d
checkpoint: avoid2d
units: [left, right, both, cluttered, narrow_passage, narrower_passage]
eval: {n_seeds: 40, n_episodes: 5}
logl: false
table:
  columns: {Fallback rate: fallback_rate, Safe-SR: success, NFE: nfe}
  percent: [fallback_rate, success]
methods:
  k/(k+delta): {sampler: cspi, k: [5.0, 10.0, 20.0], k_max: 5, tau: 0.01, step_size: 0.5}
  constant n:  {sampler: cspi, k: 10.0, n_schedule: [0.5, 0.8], k_max: 5, tau: 0.01, step_size: 0.5}
  zero noise:  {sampler: cspi, k: [5.0, 10.0, 20.0], fresh_noise: false, k_max: 5, tau: 0.01, step_size: 0.5}
